<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c4a3c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Fáilte Abhaile helps families learn Irish together, from parent to child to teacher." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <title>Fáilte Abhaile</title>
  <style>
    :root {
      --bg: #f3efe8;
      --panel: #ffffff;
      --panel-soft: #edf7f3;
      --navy: #163b3a;
      --green: #1e7f67;
      --green-deep: #0f5d4e;
      --gold: #d7a64a;
      --gold-soft: #f3d29c;
      --text: #18312d;
      --muted: #5d736f;
      --line: #dfe7e2;
      --danger: #b65f52;
      --warning: #f4b558;
      --shadow: 0 12px 30px rgba(17, 42, 38, 0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: linear-gradient(180deg, #f3efe8, #f7f4ef 20%, #edf2ef 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--green-deep));
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: var(--shadow);
    }
    .brand-copy { min-width: 0; }
    .brand-title {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .brand-sub {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .role-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
      box-shadow: 0 8px 18px rgba(30,127,103,0.2);
    }

    .page {
      display: none;
      padding: 18px 18px 32px;
    }
    .page.active { display: block; }

    .hero {
      background: linear-gradient(135deg, rgba(23,70,60,0.97), rgba(17,73,62,0.92));
      border-radius: 24px;
      padding: 22px 18px;
      color: white;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.15), transparent 35%);
    }
    .hero > * { position: relative; z-index: 1; }
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.78);
      margin-bottom: 12px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -0.06em;
    }
    .hero p {
      margin: 12px 0 0;
      font-size: 0.96rem;
      color: rgba(255,255,255,0.9);
      max-width: 620px;
    }

    .grid { display: grid; gap: 18px; }
    .grid.two { grid-template-columns: 1fr; }
    .grid.three { grid-template-columns: 1fr; }
    @media (min-width: 760px) {
      .grid.two { grid-template-columns: 1.3fr 1fr; }
      .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }
    .card h2, .card h3 {
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    .subtle {
      color: var(--muted);
      margin: 0;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .stat-row {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      gap: 12px;
    }
    .stat:last-child { border-bottom: 0; padding-bottom: 0; }
    .stat strong { color: var(--green-deep); font-size: 1.1rem; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button, .button {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--green), var(--green-deep));
      color: white;
      font-weight: 800;
      padding: 11px 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(15,93,78,0.18);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    button:active, .button:active { transform: translateY(1px); }
    button.alt, .button.alt {
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      box-shadow: none;
      color: var(--text);
    }
    button.ghost, .button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      box-shadow: none;
    }

    .pill {
      display: inline-block;
      background: rgba(30,127,103,0.12);
      color: var(--green-deep);
      border: 1px solid rgba(30,127,103,0.2);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .homework-list, .teacher-list, .admin-list, .resource-list, .message-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .list-item {
      background: #f8faf8;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px;
    }
    .list-item .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    .list-item h4 { margin: 0; font-size: 1.02rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 9px;
      border-radius: 999px;
    }
    .status.good { background: rgba(30,127,103,0.12); color: var(--green-deep); }
    .status.warn { background: rgba(244,181,88,0.12); color: #8b5b1e; }
    .status.alert { background: rgba(182,95,82,0.12); color: var(--danger); }

    .lesson-grid { display: grid; gap: 14px; margin-top: 16px; }
    .lesson-card {
      border: 1px solid var(--line);
      background: #f9faf8;
      border-radius: 16px;
      padding: 14px;
    }
    .lesson-card .irish {
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--green-deep);
      margin-bottom: 8px;
    }
    .small {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }
    .muted { color: var(--muted); }
    .pronounce {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30,127,103,0.08);
      border: 1px solid rgba(30,127,103,0.14);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      color: var(--green-deep);
      margin-top: 8px;
    }

    .settings-grid {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(30,127,103,0.6);
      box-shadow: 0 0 0 4px rgba(30,127,103,0.08);
    }
    textarea { min-height: 96px; resize: vertical; }

    .quiz-box, .game-box {
      border: 1px solid var(--line);
      background: #f9faf8;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }
    .quiz-actions, .game-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .mcq-grid {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .mcq-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      background: white;
      font-weight: 700;
    }
    .mcq-item.correct { background: rgba(30,127,103,0.12); border-color: rgba(30,127,103,0.4); }
    .mcq-item.wrong { background: rgba(182,95,82,0.08); border-color: rgba(182,95,82,0.25); }

    .dash-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(135deg, rgba(30,127,103,0.06), rgba(215,166,74,0.08));
      border: 1px solid rgba(30,127,103,0.18);
      border-radius: 18px;
      padding: 16px;
      margin-top: 14px;
    }
    .dash-cta strong { font-size: 1.1rem; }

    .message {
      background: linear-gradient(180deg, #fff, #f5faf7);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 88px;
      z-index: 50;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(180deg, #d7a64a, #b77e28);
      color: white;
      border: 0;
      font-size: 1.8rem;
      box-shadow: 0 18px 22px rgba(183,126,40,0.28);
    }

    @media (min-width: 760px) {
      .app { padding-bottom: 120px; }
      .topbar { padding-left: 26px; padding-right: 26px; }
      .page { padding: 22px 26px 40px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div class="brand-copy">
          <div class="brand-title">Fáilte Abhaile</div>
          <div class="brand-sub">Family Irish Learning</div>
        </div>
      </div>
      <div class="role-switcher" id="roleSwitcher"></div>
    </header>

    <main>
      <section class="page active" id="landingPage"></section>
      <section class="page" id="parentPage"></section>
      <section class="page" id="childPage"></section>
      <section class="page" id="teacherPage"></section>
      <section class="page" id="adminPage"></section>
    </main>
  </div>

  <button class="fab" id="fabButton" aria-label="Quick action">＋</button>

  <script>
    const state = {
      role: 'parent',
      selectedTopic: 'An Scoil',
      school: {
        name: 'Scoil Naomh Bríd',
        teachers: ['Mairéad Ó Súilleabháin', 'Seán Daly', 'Aoife Ní Chonchúir'],
        classes: ['3rd Class', '4th Class', '5th Class']
      },
      vocab: [
        { id: 1, word: 'bord', meaning: 'table', pronunciation: 'bord', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Masculine noun', munster: 'bord', standard: 'bord', example: 'Tá an bord sa rang.' },
        { id: 2, word: 'cathaoir', meaning: 'chair', pronunciation: 'ka-HUR', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Feminine noun', munster: 'cathaoir', standard: 'cathaoir', example: 'Seo cathaoir na múinteora.' },
        { id: 3, word: 'leabhar', meaning: 'book', pronunciation: 'LIA-var', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Masculine noun', munster: 'leabhar', standard: 'leabhar', example: 'Tá mo leabhar ar an mbord.' },
        { id: 4, word: 'peann', meaning: 'pen', pronunciation: 'pahn', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Masculine noun', munster: 'peann', standard: 'peann', example: 'An peann seo is deas.' },
        { id: 5, word: 'mála', meaning: 'bag', pronunciation: 'MAW-la', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Feminine noun', munster: 'mála', standard: 'mála', example: 'Tá an mhála faoi do chathaoir.' },
        { id: 6, word: 'múinteoir', meaning: 'teacher', pronunciation: 'MOO-in-tor', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Masculine noun', munster: 'múinteoir', standard: 'múinteoir', example: 'Tá an múinteoir ag múineadh.' },
        { id: 7, word: 'rang', meaning: 'classroom', pronunciation: 'rang', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Masculine noun', munster: 'rang', standard: 'rang', example: 'Tá na daltaí sa rang.' },
        { id: 8, word: 'scoil', meaning: 'school', pronunciation: 'skohl', topic: 'An Scoil', classYear: '3rd Class', grammar: 'Feminine noun', munster: 'scoil', standard: 'scoil', example: 'Téann mé ar scoil gach maidin.' },
        { id: 9, word: 'clár', meaning: 'board', pronunciation: 'k-lawr', topic: 'An Scoil', classYear: '4th Class', grammar: 'Masculine noun', munster: 'clár', standard: 'clár', example: 'Scríobhaimid ar an gclár.' },
        { id: 10, word: 'aicme', meaning: 'class', pronunciation: 'AK-muh', topic: 'An Scoil', classYear: '4th Class', grammar: 'Feminine noun', munster: 'aicme', standard: 'aicme', example: 'Tá an aicme ag foghlaim.' }
      ],
      homework: [
        { id: 1, className: '3rd Class', topic: 'An Scoil', title: 'Homework: An Scoil', due: 'Friday', status: 'Due today', parentTask: 'Teach me first, then help your child with the words and meanings.', teacherNote: 'Focus on classroom nouns and pronunciation.', submissions: [] }
      ],
      announcements: [
        { title: 'Homework update', message: 'Tonight’s Irish homework has changed. Please complete the classroom nouns section and the oral practice task.' },
        { title: 'School notice', message: 'Family Irish workshop is on Thursday after school for parents. All welcome.' }
      ],
      messageThreads: [
        { from: 'Mairéad', title: 'Celebration', preview: 'Well done on the vocabulary recap this week.' },
        { from: 'School Office', title: 'Parent update', preview: 'Parent workshop is confirmed for Thursday evening.' }
      ],
      progress: { child: 78, teacher: 86, parent: 62 }
    };

    const roleMeta = {
      parent: { label: 'Parent' },
      child: { label: 'Child' },
      teacher: { label: 'Teacher' },
      admin: { label: 'School Admin' }
    };

    const pages = {
      landing: document.getElementById('landingPage'),
      parent: document.getElementById('parentPage'),
      child: document.getElementById('childPage'),
      teacher: document.getElementById('teacherPage'),
      admin: document.getElementById('adminPage')
    };

    const roleSwitcher = document.getElementById('roleSwitcher');
    const fabButton = document.getElementById('fabButton');

    function setRole(role) {
      state.role = role;
      renderAll();
    }

    function renderRoleSwitcher() {
      roleSwitcher.innerHTML = Object.entries(roleMeta).map(([key, meta]) => `
        <button class="chip ${key === state.role ? 'active' : ''}" data-role="${key}">${meta.label}</button>
      `).join('');
      roleSwitcher.querySelectorAll('[data-role]').forEach((button) => {
        button.addEventListener('click', () => setRole(button.dataset.role));
      });
    }

    function renderLanding() {
      pages.landing.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Language learning for families</div>
          <h1>Fáilte Abhaile</h1>
          <p>The parent-first Irish learning platform for families, schools and teachers across Munster. The child learns with confidence because the parent learns first.</p>
        </div>

        <div class="grid two">
          <div class="card">
            <h2>Why this app exists</h2>
            <p class="subtle">Many children know more Irish than the parent. Fáilte Abhaile solves that by turning the parent into the first teacher, then helping the child practise through games and class-based tasks.</p>
            <div class="btn-row">
              <button id="landingParentBtn">Open Parent Hub</button>
              <button class="alt" id="landingTeacherBtn">Open Teacher Hub</button>
            </div>
          </div>

          <div class="card">
            <h2>Core learning loop</h2>
            <div class="stat-row">
              <div class="stat"><span>Teacher assigns</span><strong>Vocabulary</strong></div>
              <div class="stat"><span>Parent learns</span><strong>Teach Me First</strong></div>
              <div class="stat"><span>Child plays</span><strong>Games</strong></div>
              <div class="stat"><span>Teacher reviews</span><strong>Feedback</strong></div>
            </div>
          </div>
        </div>

        <div class="grid three" style="margin-top:18px;">
          <div class="card"><h3>For parents</h3><p class="subtle">Plain-English explanations, pronunciation, examples and guided support.</p></div>
          <div class="card"><h3>For children</h3><p class="subtle">Bright, playful activities built around real class vocabulary.</p></div>
          <div class="card"><h3>For schools</h3><p class="subtle">Teacher, class and school-level management with secure access.</p></div>
        </div>
      `;
      document.getElementById('landingParentBtn').addEventListener('click', () => setRole('parent'));
      document.getElementById('landingTeacherBtn').addEventListener('click', () => setRole('teacher'));
    }

    function renderParentDashboard() {
      const homework = state.homework[0];
      const vocabSet = state.vocab.filter((item) => item.topic === homework.topic).slice(0, 5);

      pages.parent.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Parent dashboard</div>
          <h1>What does my child need today?</h1>
          <p>Keep it simple. Learn the Irish first, then help your child.</p>
        </div>

        <div class="grid two">
          <div class="card">
            <h2>Today's homework</h2>
            <div class="dash-cta">
              <div>
                <strong>${homework.title}</strong><br />
                <span class="muted">${homework.topic} · ${homework.className} · Due ${homework.due}</span>
              </div>
              <button id="teachMeBtn">Teach Me First</button>
            </div>
            <div class="btn-row">
              <button id="helpChildBtn">Help My Child</button>
              <button class="alt" id="submitWorkBtn">Submit Work</button>
            </div>
            <div class="stat-row">
              <div class="stat"><span>Child progress</span><strong>${state.progress.child}%</strong></div>
              <div class="stat"><span>Teacher note</span><strong>${homework.teacherNote}</strong></div>
              <div class="stat"><span>Recommended practice</span><strong>3 short rounds</strong></div>
            </div>
          </div>

          <div class="card">
            <h2>School updates</h2>
            <div class="message-list">
              ${state.announcements.map((item) => `
                <div class="message">
                  <div class="small">${item.title}</div>
                  <p class="subtle">${item.message}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="grid two" style="margin-top:18px;">
          <div class="card">
            <h2>Learning this week</h2>
            <div class="lesson-grid">
              ${vocabSet.map((item) => `
                <div class="lesson-card">
                  <div class="small">${item.topic}</div>
                  <div class="irish">${item.word}</div>
                  <div><strong>${item.meaning}</strong></div>
                  <div class="pronounce">🔊 ${item.pronunciation}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h2>Teacher messages</h2>
            <div class="message-list">
              ${state.messageThreads.map((thread) => `
                <div class="message">
                  <div class="small">From ${thread.from}</div>
                  <strong>${thread.title}</strong>
                  <p class="subtle">${thread.preview}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('teachMeBtn').addEventListener('click', showTeachMe);
      document.getElementById('helpChildBtn').addEventListener('click', () => setRole('child'));
      document.getElementById('submitWorkBtn').addEventListener('click', submitHomework);
    }

    function showTeachMe() {
      const relevantWords = state.vocab.filter((item) => item.topic === state.selectedTopic).slice(0, 6);
      pages.parent.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Parent support</div>
          <h1>Teach Me First</h1>
          <p>Learn the key Irish before you help your child. Each phrase is explained in plain English and designed for real family support.</p>
        </div>

        <div class="grid three">
          ${relevantWords.map((item) => `
            <div class="card lesson-card">
              <div class="small">${item.topic}</div>
              <div class="irish">${item.word}</div>
              <div class="muted">English: <strong>${item.meaning}</strong></div>
              <div class="pronounce">🔊 ${item.pronunciation}</div>
              <p class="subtle" style="margin-top:10px;"><strong>Simple meaning:</strong> ${item.example}</p>
              <p class="subtle"><strong>Grammar:</strong> ${item.grammar}</p>
              <p class="subtle"><strong>Munster:</strong> ${item.munster} · <strong>Standard:</strong> ${item.standard}</p>
              <div class="btn-row"><button class="alt" data-speak="${item.word}">Play audio</button></div>
            </div>
          `).join('')}
        </div>

        <div class="btn-row" style="margin-top:18px;">
          <button onclick="setRole('parent')">Back to parent dashboard</button>
        </div>
      `;

      pages.parent.querySelectorAll('[data-speak]').forEach((el) => {
        el.addEventListener('click', () => speakWord(el.dataset.speak));
      });
    }

    function renderChildDashboard() {
      const topic = state.selectedTopic;
      const currentSet = state.vocab.filter((item) => item.topic === topic).slice(0, 4);

      pages.child.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Child interface</div>
          <h1>Let’s learn together</h1>
          <p>Playful Irish activities built around your class words and your teacher’s topics.</p>
        </div>

        <div class="card">
          <h2>Today’s topic</h2>
          <div class="pill">${topic}</div>
          <div class="pill">3rd Class</div>
          <div class="btn-row">
            <button data-game="quiz">Quick Quiz</button>
            <button class="alt" data-game="memory">Memory</button>
            <button class="alt" data-game="builder">Word Builder</button>
          </div>
        </div>

        <div class="grid two">
          <div class="card">
            <h2>Vocabulary to practise</h2>
            <div class="lesson-grid">
              ${currentSet.map((item) => `
                <div class="lesson-card">
                  <div class="small">${item.word}</div>
                  <div class="irish">${item.word}</div>
                  <div class="muted">${item.meaning}</div>
                  <div class="btn-row"><button class="alt" data-speak-child="${item.word}">Hear it</button></div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h2>Game hall</h2>
            <div id="childGameArea"></div>
          </div>
        </div>
      `;

      pages.child.querySelectorAll('[data-game]').forEach((button) => {
        button.addEventListener('click', () => loadGame(button.dataset.game));
      });
      pages.child.querySelectorAll('[data-speak-child]').forEach((button) => {
        button.addEventListener('click', () => speakWord(button.dataset.speakChild));
      });
      loadGame('quiz');
    }

    function loadGame(type) {
      const area = document.getElementById('childGameArea');
      if (!area) return;

      if (type === 'quiz') {
        const question = state.vocab[Math.floor(Math.random() * state.vocab.length)];
        area.innerHTML = `
          <div class="quiz-box">
            <div class="small">Listening challenge</div>
            <h3>${question.word}</h3>
            <p class="subtle">Choose the correct English meaning.</p>
            <div class="mcq-grid">
              ${[question.meaning, 'window', 'door', 'night'].sort(() => Math.random() - 0.5).map((option) => `
                <button class="mcq-item" data-answer="${option}">${option}</button>
              `).join('')}
            </div>
            <div class="quiz-actions">
              <button class="alt" onclick="loadGame('quiz')">Next question</button>
            </div>
          </div>
        `;

        area.querySelectorAll('.mcq-item').forEach((item) => {
          item.addEventListener('click', () => {
            const isCorrect = item.dataset.answer === question.meaning;
            item.classList.add(isCorrect ? 'correct' : 'wrong');
            item.textContent = `${item.textContent}${isCorrect ? ' ✅' : ' ❌'}`;
          });
        });
      }

      if (type === 'memory') {
        const items = state.vocab.slice(0, 4);
        area.innerHTML = `
          <div class="game-box">
            <div class="small">Memory</div>
            <div class="mcq-grid">
              ${items.map((item) => `
                <button class="mcq-item" data-memory="${item.word}">${item.word}</button>
              `).join('')}
            </div>
            <p class="subtle">Match the words to their meaning.</p>
          </div>
        `;
      }

      if (type === 'builder') {
        const word = state.vocab[Math.floor(Math.random() * state.vocab.length)].word;
        area.innerHTML = `
          <div class="game-box">
            <div class="small">Word builder</div>
            <h3>Type the word</h3>
            <input id="wordBuilderInput" placeholder="Write the Irish word" />
            <div class="game-actions">
              <button id="wordBuilderCheck">Check</button>
              <button class="alt" onclick="loadGame('builder')">New word</button>
            </div>
            <p class="subtle">Target word: <strong>${word}</strong></p>
          </div>
        `;

        document.getElementById('wordBuilderCheck').addEventListener('click', () => {
          const value = document.getElementById('wordBuilderInput').value.trim();
          const isCorrect = value.toLowerCase() === word.toLowerCase();
          const msg = isCorrect ? 'Excellent! You built it correctly.' : `Not quite — try again. The target is ${word}.`;
          alert(msg);
        });
      }
    }

    function renderTeacherDashboard() {
      const hw = state.homework[0];
      const vocabularyItems = state.vocab.slice(0, 8);

      pages.teacher.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Teacher</div>
          <h1>Today’s overview</h1>
          <p>Fast access to homework, class status and the vocabulary that matters.</p>
        </div>

        <div class="grid two">
          <div class="card">
            <h2>3rd Class</h2>
            <div class="stat-row">
              <div class="stat"><span>Students</span><strong>27</strong></div>
              <div class="stat"><span>Homework</span><strong>24 / 27 complete</strong></div>
              <div class="stat"><span>Vocabulary</span><strong>18 / 27 mastering</strong></div>
              <div class="stat"><span>Needs practice</span><strong>3 students</strong></div>
            </div>
          </div>

          <div class="card">
            <h2>Create homework</h2>
            <div class="settings-grid">
              <div>
                <label for="teacherClass">Class</label>
                <select id="teacherClass"><option>3rd Class</option><option>4th Class</option></select>
              </div>
              <div>
                <label for="teacherTopic">Topic</label>
                <select id="teacherTopic"><option>An Scoil</option><option>An Bhia</option><option>An Teach</option></select>
              </div>
              <div>
                <label for="teacherDue">Due</label>
                <input id="teacherDue" type="text" value="Friday" />
              </div>
              <div>
                <label for="teacherVocab">Vocabulary</label>
                <select id="teacherVocab" multiple size="5">
                  ${vocabularyItems.map((item) => `<option selected>${item.word}</option>`).join('')}
                </select>
              </div>
              <button id="assignHomeworkBtn">Assign to class</button>
            </div>
          </div>
        </div>

        <div class="grid two" style="margin-top:18px;">
          <div class="card">
            <h2>Submission review</h2>
            <div class="homework-list">
              <div class="list-item">
                <div class="top">
                  <h4>${hw.title}</h4>
                  <span class="status good">Submitted</span>
                </div>
                <div class="subtle">Parent note: “Completed. She struggled with the pronunciation of two words.”</div>
              </div>
            </div>
          </div>

          <div class="card">
            <h2>Teacher-approved vocabulary</h2>
            <div class="resource-list">
              ${vocabularyItems.map((item) => `
                <div class="list-item">
                  <div class="top">
                    <h4>${item.word}</h4>
                    <span class="status good">Approved</span>
                  </div>
                  <div class="subtle">${item.meaning} · ${item.grammar}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('assignHomeworkBtn').addEventListener('click', () => {
        const selection = document.getElementById('teacherVocab');
        const values = Array.from(selection.selectedOptions).map((option) => option.value);
        state.homework.push({
          id: Date.now(),
          className: document.getElementById('teacherClass').value,
          topic: document.getElementById('teacherTopic').value,
          title: `${document.getElementById('teacherTopic').value} homework`,
          due: document.getElementById('teacherDue').value,
          status: 'New assignment',
          parentTask: 'Learn the new words first, then help your child.',
          teacherNote: values.join(', '),
          submissions: []
        });
        alert('Homework assigned and sent to the parent dashboard.');
        setRole('parent');
      });
    }

    function renderAdminDashboard() {
      pages.admin.innerHTML = `
        <div class="hero">
          <div class="eyebrow">School admin</div>
          <h1>School hub</h1>
          <p>Manage classes, teachers, permissions and school announcements with a secure overview.</p>
        </div>

        <div class="grid three">
          <div class="card">
            <h2>Teachers</h2>
            <div class="teacher-list">
              ${state.school.teachers.map((teacher) => `
                <div class="list-item">
                  <div class="top">
                    <h4>${teacher}</h4>
                    <span class="status good">Active</span>
                  </div>
                  <div class="subtle">Role: Teacher · Classes: 2</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h2>Classes</h2>
            <div class="teacher-list">
              ${state.school.classes.map((className) => `
                <div class="list-item">
                  <div class="top">
                    <h4>${className}</h4>
                    <span class="status warn">Live</span>
                  </div>
                  <div class="subtle">27 students · 2 teachers · 1 active topic</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h2>School messages</h2>
            <div class="teacher-list">
              ${state.announcements.map((item) => `
                <div class="list-item">
                  <div class="top"><h4>${item.title}</h4></div>
                  <div class="subtle">${item.message}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function submitHomework() {
      const note = prompt('Optional note for the teacher:', 'Completed.');
      if (note === null) return;
      state.homework[0].submissions.push({ parent: 'Parent', note, status: 'Submitted' });
      alert('Work submitted to the teacher.');
      setRole('teacher');
    }

    function speakWord(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'ga-IE';
      utterance.rate = 0.75;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderAll() {
      renderRoleSwitcher();
      renderLanding();
      renderParentDashboard();
      renderChildDashboard();
      renderTeacherDashboard();
      renderAdminDashboard();

      Object.keys(pages).forEach((key) => {
        pages[key].classList.remove('active');
      });

      if (state.role === 'landing') {
        pages.landing.classList.add('active');
      } else {
        pages[`${state.role}Page`].classList.add('active');
      }

      fabButton.textContent = state.role === 'parent' ? '✦' : state.role === 'child' ? '🎮' : state.role === 'teacher' ? '＋' : '⚙';
      fabButton.onclick = () => {
        if (state.role === 'parent') {
          showTeachMe();
        } else if (state.role === 'child') {
          loadGame('quiz');
        } else if (state.role === 'teacher') {
          document.getElementById('assignHomeworkBtn')?.click();
        } else {
          setRole('admin');
        }
      };
    }

    renderAll();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
